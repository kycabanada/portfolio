<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kristine Cabanada | IT student and web developer</title>
    <meta
      name="description"
      content="Portfolio of Kristine Cabanada, a BS Information Technology student at the University of Santo Tomas who builds full-stack web applications."
    />
    <link rel="canonical" href="https://kristine-portfolio-one.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews (LinkedIn, Messenger, X, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kristine Cabanada" />
    <meta property="og:title" content="Kristine Cabanada | IT student and web developer" />
    <meta
      property="og:description"
      content="BS IT student at the University of Santo Tomas who builds full-stack web apps with React, TypeScript, ASP.NET, PHP and MySQL."
    />
    <meta property="og:url" content="https://kristine-portfolio-one.vercel.app/" />
    <meta property="og:image" content="https://kristine-portfolio-one.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kristine Cabanada's portfolio home screen" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="image" href="/kristine-cutout.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#f3eee4" />
    <script>
      // Apply the saved theme before the page paints, so it never flashes.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
